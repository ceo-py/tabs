# TABS 90 — Caddy site block
#
# The global /etc/caddy/Caddyfile does `import caddy.d/*.conf`, so every site
# keeps its own file in /etc/caddy/caddy.d/. This one belongs to
# tabs.ceo-py.eu and is installed as /etc/caddy/caddy.d/tabs.conf:
#
#   sudo cp /home/ceo/production/tabs-repo/deploy/tabs.conf /etc/caddy/caddy.d/tabs.conf
#   sudo caddy validate --config /etc/caddy/Caddyfile
#   sudo systemctl restart caddy
#
# NOTE: the global Caddyfile sets `admin off`, so the Admin API on :2019 is
# not running and `caddy reload` / `systemctl reload caddy` always fail with
# "connection refused". A full restart is the only way to apply changes.
#
# The site itself is served from /home/ceo/production/tabs.
#
# ---------------------------------------------------------------------------
# Why this is a single block and not a reverse_proxy to localhost:8004:
#
# A site address without a port (like `tabs.ceo-py.eu`) matches that host on
# EVERY port of the same Caddy instance. A request coming back from
# `reverse_proxy 127.0.0.1:8004` still carries `Host: tabs.ceo-py.eu`, so it
# would match this very block again -> proxy to itself -> loop -> the client
# gets an empty 200 with no body.
#
# Serving the files directly from the hostname block avoids the extra hop and
# the loop, and keeps nothing but 80/443 open. Should you ever want the site
# behind a separate local port, bind it to loopback AND rewrite the Host:
#
#   tabs.ceo-py.eu {
#       reverse_proxy 127.0.0.1:8004 {
#           header_up Host 127.0.0.1:8004
#       }
#   }
#   http://127.0.0.1:8004 {
#       root * /home/ceo/production/tabs
#       file_server
#   }
# ---------------------------------------------------------------------------

tabs.ceo-py.eu {
	root * /home/ceo/production/tabs
	file_server

	encode zstd gzip

	# the manifest lists the songs -> never cache it, new cards appear at once
	@manifest path /data/songs.json
	header @manifest Cache-Control "no-cache, must-revalidate"

	# the card images never change under the same name -> cache them hard
	@assets path /cards/* /thumbs/*
	header @assets Cache-Control "public, max-age=86400, immutable"

	header {
		X-Content-Type-Options "nosniff"
		Referrer-Policy "strict-origin-when-cross-origin"
		Permissions-Policy "geolocation=(), microphone=(), camera=()"
		Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self'; media-src 'self'"
	}

	log {
		output file /var/log/caddy/tabs-access.log {
			roll_size 10MiB
			roll_keep 5
		}
	}
}
